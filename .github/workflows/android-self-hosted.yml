name: Android self-hosted CI

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/android-self-hosted.yml
      - android/**
      - heycyan-core/**
      - tools/hil/**
      - .gitmodules
      - README.md

permissions:
  contents: read
  packages: read

concurrency:
  group: android-self-hosted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build, unit, and emulator tests
    if: github.repository == 'FerSaiyan/Alternative-HeyCyan-App-and-SDK'
    runs-on: [self-hosted, linux, x64, homelab]
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        env:
          # The Android build no longer requires Moonshine/LFS assets. Keep automatic
          # smudging disabled so unrelated LFS content cannot slow persistent runners.
          GIT_LFS_SKIP_SMUDGE: '1'
        with:
          submodules: recursive
          lfs: false

      - name: Verify local Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"
          command -v python3 >/dev/null
          test -x /opt/android-studio/jbr/bin/java
          test -d "$HOME/Android/Sdk/platforms/android-35"
          test -x "$HOME/Android/Sdk/platform-tools/adb"
          {
            printf 'JAVA_HOME=/opt/android-studio/jbr\n'
            printf 'ANDROID_HOME=%s\n' "$HOME/Android/Sdk"
            printf 'ANDROID_SDK_ROOT=%s\n' "$HOME/Android/Sdk"
            printf '%s\n' "$HOME/Android/Sdk/platform-tools" >> "$GITHUB_PATH"
          } >> "$GITHUB_ENV"
          /opt/android-studio/jbr/bin/java -version
          "$HOME/Android/Sdk/platform-tools/adb" version

      - name: Verify Meta SDK credential
        env:
          META_GITHUB_TOKEN: ${{ secrets.META_GITHUB_TOKEN }}
        run: test -n "$META_GITHUB_TOKEN"

      - name: Validate Tasker integration contracts
        run: python3 tools/hil/validate_tasker_profiles.py

      - name: Run Android and shared tests
        env:
          META_GITHUB_TOKEN: ${{ secrets.META_GITHUB_TOKEN }}
        working-directory: android/CyanBridge
        run: >-
          ./gradlew --no-daemon --stacktrace
          :app:testDebugUnitTest
          :shared:portabilityTest

      - name: Assemble debug and instrumentation APKs
        env:
          META_GITHUB_TOKEN: ${{ secrets.META_GITHUB_TOKEN }}
        working-directory: android/CyanBridge
        run: >-
          ./gradlew --no-daemon --stacktrace
          -PtestAbi=x86_64
          :app:assembleDebug
          :app:assembleDebugAndroidTest

      - name: Find or start local automation emulator
        id: emulator
        shell: bash
        env:
          CYANBRIDGE_HIL_EMULATOR_AVD: ${{ vars.CYANBRIDGE_HIL_EMULATOR_AVD || '' }}
        run: |
          set -euo pipefail
          serial="$(bash tools/hil/start_emulator.sh)"
          test -n "$serial"
          test "$(adb -s "$serial" get-state)" = "device"
          echo "serial=$serial" >> "$GITHUB_OUTPUT"

      - name: Install branch build on local emulator
        run: bash tools/hil/install.sh '${{ steps.emulator.outputs.serial }}'

      - name: Run Mock DAT and Meta pairing instrumentation
        run: >-
          bash tools/hil/run_instrumentation.sh
          '${{ steps.emulator.outputs.serial }}'
          emulator
          com.fersaiyan.cyanbridge.ui.MetaPairingMockFlowTest,com.fersaiyan.cyanbridge.ui.MetaPairingScreenTest

      - name: Run hermetic audio instrumentation
        run: >-
          bash tools/hil/run_instrumentation.sh
          '${{ steps.emulator.outputs.serial }}'
          emulator
          com.fersaiyan.cyanbridge.hil.audio.AudioEmulatorHarnessTest#assets_AllThreeFixturesExist,com.fersaiyan.cyanbridge.hil.audio.AudioEmulatorHarnessTest#meetingTranscriptionFromSeededAsset_hermetic,com.fersaiyan.cyanbridge.hil.audio.AudioEmulatorHarnessTest#handsFreeTranslator_fromAssetTranscript,com.fersaiyan.cyanbridge.hil.audio.AudioEmulatorHarnessTest#geminiLive_pcmInjectionDoesNotCrash

      - name: Start storage-sized Walking Aid emulator
        id: walking_aid_emulator
        env:
          CYANBRIDGE_WALKING_AID_AVD: ${{ vars.CYANBRIDGE_WALKING_AID_AVD || 'CyanBridge_Walking_Aid_CI' }}
          CYANBRIDGE_WALKING_AID_STOP_OTHER_EMULATORS: 'true'
        run: |
          serial="$(bash tools/hil/start_walking_aid_emulator.sh)"
          echo "serial=$serial" >> "$GITHUB_OUTPUT"

      - name: Install branch build on Walking Aid emulator
        run: bash tools/hil/install.sh '${{ steps.walking_aid_emulator.outputs.serial }}'

      - name: Run Walking Aid real models on emulator
        env:
          WALKING_AID_CI_CACHE_DIR: ${{ runner.temp }}/../cyanbridge-model-cache/walking-aid
        run: bash tools/hil/run_walking_aid_model_ci.sh '${{ steps.walking_aid_emulator.outputs.serial }}'

      - name: Upload Walking Aid model diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walking-aid-model-results-${{ github.sha }}
          path: build/hil/results/walking-aid-model-ci/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cyanbridge-debug-apk
          path: android/CyanBridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
