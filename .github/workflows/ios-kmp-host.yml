name: iOS KMP host

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/ios-kmp-host.yml
      - android/CyanBridge/shared/**
      - android/CyanBridge/app/**
      - android/CyanBridge/settings.gradle.kts
      - android/CyanBridge/build.gradle.kts
      - android/CyanBridge/gradle/**
      - android/CyanBridge/gradle.properties
      - ios/CyanBridgeKMPHost/**
      - ios/CyanBridgeKMPHostTests/**
      - ios/QCSDKDemo/**
      - ios/QCSDK.framework/**
      - ios/QCSDKDemo.xcodeproj/**
      - ios/scripts/verify_kmp_host.py

permissions:
  contents: read
  packages: read

concurrency:
  group: ios-kmp-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-simulator-host:
    name: Build KMP framework and iOS simulator host
    runs-on: macos-14
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Fetch Moonshine iOS LFS assets
        working-directory: third_party/moonshine
        run: >-
          git lfs pull
          --include="core/speaker-embedding-model-data.cpp,core/third-party/onnxruntime/lib/ios/simulator/libonnxruntime.a,core/third-party/onnxruntime/lib/ios/arm64/libonnxruntime.a"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: android/CyanBridge/**/*.gradle*

      - name: Verify the isolated iOS host structure
        run: python3 ios/scripts/verify_kmp_host.py

      - name: Link the Apple-Silicon simulator framework
        working-directory: android/CyanBridge
        run: ./gradlew --no-daemon -PenableAppleTargets=true :shared:linkDebugFrameworkIosSimulatorArm64

      - name: Build the device-only QCSDK demo
        run: >-
          xcodebuild
          -project ios/QCSDKDemo.xcodeproj
          -scheme QCSDKDemo
          -configuration Debug
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/QCSDKDemoDerivedData"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""
          ENABLE_USER_SCRIPT_SANDBOXING=NO
          build

      - name: Build the unsigned SwiftUI simulator host
        run: >-
          xcodebuild
          -project ios/QCSDKDemo.xcodeproj
          -scheme CyanBridgeKMPHost
          -configuration Debug
          -sdk iphonesimulator
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.2'
          -derivedDataPath "$RUNNER_TEMP/CyanBridgeDerivedData"
          CODE_SIGNING_ALLOWED=NO
          ENABLE_USER_SCRIPT_SANDBOXING=NO
          build

      - name: Upload Xcode build logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-kmp-host-build-logs
          path: |
            ${{ runner.temp }}/CyanBridgeDerivedData/Logs
            ${{ runner.temp }}/QCSDKDemoDerivedData/Logs
          if-no-files-found: warn
          retention-days: 7
