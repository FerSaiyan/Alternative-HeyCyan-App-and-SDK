name: Android Tasker HIL

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - security/tasker-agent-split
      - 'security/tasker-*'
      - 'tasker/**'
    paths:
      - .github/workflows/android-tasker-hil.yml
      - android/**
      - tools/hil/**
      - heycyan-core/**
      - .gitmodules

permissions:
  contents: read
  packages: read

# There is one shared lab phone. Main and feature branches must queue behind each other too.
concurrency:
  group: cyanbridge-android-hil-phone-01
  cancel-in-progress: false

jobs:
  tasker-hil:
    name: Emulator smoke + physical Tasker HIL
    if: github.repository == 'FerSaiyan/Alternative-HeyCyan-App-and-SDK'
    runs-on: [self-hosted, linux, x64, homelab]
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        env:
          # Persistent self-hosted workspaces may already contain an LFS pre-push hook.
          # Skip checkout's LFS setup and hydrate the required nested assets explicitly.
          GIT_LFS_SKIP_SMUDGE: '1'
        with:
          submodules: recursive

      - name: Fetch Moonshine Android LFS assets
        working-directory: third_party/moonshine
        run: >-
          git lfs pull
          --include="core/speaker-embedding-model-data.cpp,core/third-party/onnxruntime/lib/android/arm64/libonnxruntime.so"

      - name: Configure local Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"
          command -v python3 >/dev/null
          command -v git-lfs >/dev/null
          test -x /opt/android-studio/jbr/bin/java
          test -d "$HOME/Android/Sdk/platforms/android-35"
          test -x "$HOME/Android/Sdk/platform-tools/adb"
          {
            printf 'JAVA_HOME=/opt/android-studio/jbr\n'
            printf 'ANDROID_HOME=%s\n' "$HOME/Android/Sdk"
            printf 'ANDROID_SDK_ROOT=%s\n' "$HOME/Android/Sdk"
            printf '%s\n' "$HOME/Android/Sdk/platform-tools" >> "$GITHUB_PATH"
          } >> "$GITHUB_ENV"

      - name: Verify Meta SDK credential
        env:
          GITHUB_TOKEN: ${{ secrets.META_GITHUB_TOKEN }}
        run: test -n "$GITHUB_TOKEN"

      - name: Validate Tasker and Play-sensitive contracts
        run: python3 tools/hil/validate_tasker_profiles.py

      - name: Build debug app and instrumentation APKs
        env:
          GITHUB_TOKEN: ${{ secrets.META_GITHUB_TOKEN }}
        working-directory: android/CyanBridge
        run: >-
          ./gradlew --no-daemon --stacktrace
          :app:assembleDebug
          :app:assembleDebugAndroidTest

      - name: Find or start emulator
        id: emulator
        shell: bash
        run: |
          set +e
          serial="$(bash tools/hil/start_emulator.sh)"
          code=$?
          set -e
          if [ "$code" -eq 0 ] && [ -n "$serial" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "serial=$serial" >> "$GITHUB_OUTPUT"
            echo "Emulator available: $serial"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No configured AVD is available; emulator smoke test skipped." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install branch build on emulator
        if: steps.emulator.outputs.available == 'true'
        run: bash tools/hil/install.sh '${{ steps.emulator.outputs.serial }}'

      - name: Run emulator fixture smoke test
        if: steps.emulator.outputs.available == 'true'
        run: >-
          bash tools/hil/run_instrumentation.sh
          '${{ steps.emulator.outputs.serial }}'
          emulator
          com.fersaiyan.cyanbridge.hil.HilFixtureSmokeTest

      - name: Detect Tasker HIL target
        id: tasker
        shell: bash
        env:
          # Prefer the generic serial variable. Keep the phone-specific name as a fallback
          # for existing repository configuration.
          CYANBRIDGE_HIL_SERIAL: ${{ vars.CYANBRIDGE_HIL_SERIAL || vars.CYANBRIDGE_HIL_PHONE_SERIAL }}
        run: |
          source tools/hil/common.sh
          kind=physical
          serial="$(find_serial physical || true)"
          if [ -z "$serial" ]; then
            kind=emulator
            serial="$(find_serial emulator || true)"
          fi
          if [ -z "$serial" ]; then
            echo "No Android target is available for required Tasker HIL tests." | tee -a "$GITHUB_STEP_SUMMARY" >&2
            exit 1
          fi
          echo "serial=$serial" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "Tasker HIL target: $serial ($kind)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Tasker HIL preflight
        run: bash tools/hil/preflight.sh '${{ steps.tasker.outputs.serial }}'

      - name: Clear integration logcat window
        run: '$ANDROID_HOME/platform-tools/adb -s "${{ steps.tasker.outputs.serial }}" logcat -c'

      - name: Install branch build on Tasker HIL target
        run: bash tools/hil/install.sh '${{ steps.tasker.outputs.serial }}'

      - name: Sync exact branch Tasker profiles
        env:
          CYANBRIDGE_HIL_SERIAL: ${{ steps.tasker.outputs.serial }}
        run: bash tools/hil/sync_tasker_profiles.sh '${{ steps.tasker.outputs.serial }}'

      - name: Run Tasker HIL suite
        env:
          CYANBRIDGE_HIL_SERIAL: ${{ steps.tasker.outputs.serial }}
          # Leave false until the dedicated phone is paired to HeyCyan and stable.
          # Never require real glasses when the Tasker target is an emulator.
          CYANBRIDGE_HIL_GLASSES: ${{ steps.tasker.outputs.kind == 'physical' && vars.CYANBRIDGE_HIL_ENABLE_GLASSES || 'false' }}
          # Optional stronger assertion: requires a configured Gemma 4 visual model and waits
          # for the captured scene to become a candidate daily fact.
          CYANBRIDGE_HIL_EXPECT_VISUAL_FACT: ${{ steps.tasker.outputs.kind == 'physical' && vars.CYANBRIDGE_HIL_EXPECT_VISUAL_FACT || 'false' }}
        run: >-
          bash tools/hil/run_instrumentation.sh
          '${{ steps.tasker.outputs.serial }}'
          hardware
          com.fersaiyan.cyanbridge.hil.HilFixtureSmokeTest,com.fersaiyan.cyanbridge.hil.TaskerLocalAgentHilTest,com.fersaiyan.cyanbridge.hil.AutoDiaryTaskerHilTest,com.fersaiyan.cyanbridge.hil.AiTaskerProfileHilTest,com.fersaiyan.cyanbridge.hil.VisualDiaryHeyCyanHilTest

      - name: Collect Tasker HIL diagnostics
        if: failure() && steps.tasker.outputs.serial != ''
        env:
          CYANBRIDGE_HIL_SERIAL: ${{ steps.tasker.outputs.serial }}
          # Set this to true only when screenshots/UI XML are acceptable in CI artifacts.
          CYANBRIDGE_HIL_UPLOAD_VISUAL_DIAGNOSTICS: ${{ vars.CYANBRIDGE_HIL_UPLOAD_VISUAL_DIAGNOSTICS || 'false' }}
        run: bash tools/hil/collect_diagnostics.sh '${{ steps.tasker.outputs.serial }}'

      - name: Upload HIL test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyanbridge-hil-results-${{ github.sha }}
          path: |
            build/hil/results/**
            build/hil/diagnostics-safe/**
            build/hil/emulator.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload opt-in private visual diagnostics
        if: failure() && vars.CYANBRIDGE_HIL_UPLOAD_VISUAL_DIAGNOSTICS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cyanbridge-hil-private-visuals-${{ github.sha }}
          path: build/hil/diagnostics-private/**
          if-no-files-found: ignore
          retention-days: 1
