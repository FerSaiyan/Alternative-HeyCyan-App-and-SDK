name: Android Tasker HIL

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - tasker-integration-polish
      - security/tasker-agent-split
      - 'security/tasker-*'
      - 'tasker/**'
    paths:
      - .github/workflows/android-tasker-hil.yml
      - android/**
      - tools/hil/**
      - heycyan-core/**
      - .gitmodules

permissions:
  contents: read
  packages: read

# There is one shared lab runner/device set. Never cancel a run that may be midway through
# Tasker profile import, a physical glasses action, or the explicitly enabled real-email HIL.
concurrency:
  group: cyanbridge-android-hil-phone-01
  cancel-in-progress: false

jobs:
  tasker-hil:
    name: Emulator smoke + Tasker HIL
    if: github.repository == 'FerSaiyan/Alternative-HeyCyan-App-and-SDK'
    runs-on: [self-hosted, linux, x64, homelab]
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
        with:
          submodules: recursive

      - name: Fetch Moonshine Android LFS assets
        working-directory: third_party/moonshine
        run: >-
          git lfs pull
          --include="core/speaker-embedding-model-data.cpp,core/third-party/onnxruntime/lib/android/arm64/libonnxruntime.so"

      - name: Configure local Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"
          command -v python3 >/dev/null
          command -v git-lfs >/dev/null
          test -x /opt/android-studio/jbr/bin/java
          test -d "$HOME/Android/Sdk/platforms/android-35"
          test -x "$HOME/Android/Sdk/platform-tools/adb"
          {
            printf 'JAVA_HOME=/opt/android-studio/jbr\n'
            printf 'ANDROID_HOME=%s\n' "$HOME/Android/Sdk"
            printf 'ANDROID_SDK_ROOT=%s\n' "$HOME/Android/Sdk"
            printf '%s\n' "$HOME/Android/Sdk/platform-tools" >> "$GITHUB_PATH"
          } >> "$GITHUB_ENV"

      - name: Verify Meta SDK credential
        env:
          GITHUB_TOKEN: ${{ secrets.META_GITHUB_TOKEN }}
        run: test -n "$GITHUB_TOKEN"

      - name: Validate Tasker and Play-sensitive contracts
        run: python3 tools/hil/validate_tasker_profiles.py

      - name: Build debug app and instrumentation APKs
        env:
          GITHUB_TOKEN: ${{ secrets.META_GITHUB_TOKEN }}
        working-directory: android/CyanBridge
        run: >-
          ./gradlew --no-daemon --stacktrace
          :app:assembleDebug
          :app:assembleDebugAndroidTest

      - name: Find or start persistent automation emulator
        id: emulator
        shell: bash
        env:
          CYANBRIDGE_HIL_EMULATOR_AVD: ${{ vars.CYANBRIDGE_HIL_EMULATOR_AVD || '' }}
        run: |
          set +e
          serial="$(bash tools/hil/start_emulator.sh)"
          code=$?
          set -e
          if [ "$code" -eq 0 ] && [ -n "$serial" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "serial=$serial" >> "$GITHUB_OUTPUT"
            echo "Persistent automation emulator available: $serial"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No configured AVD is available; emulator layers skipped." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install branch build on emulator
        if: steps.emulator.outputs.available == 'true'
        run: bash tools/hil/install.sh '${{ steps.emulator.outputs.serial }}'

      - name: Run emulator fixture smoke test
        if: steps.emulator.outputs.available == 'true'
        run: >-
          bash tools/hil/run_instrumentation.sh
          '${{ steps.emulator.outputs.serial }}'
          emulator
          com.fersaiyan.cyanbridge.hil.HilFixtureSmokeTest

      - name: Detect core Tasker HIL target
        id: tasker
        shell: bash
        env:
          CYANBRIDGE_HIL_SERIAL: ${{ vars.CYANBRIDGE_HIL_SERIAL || vars.CYANBRIDGE_HIL_PHONE_SERIAL }}
        run: |
          source tools/hil/common.sh
          kind=physical
          serial="$(find_serial physical || true)"
          if [ -z "$serial" ]; then
            kind=emulator
            serial="$(find_serial emulator || true)"
          fi
          if [ -z "$serial" ]; then
            echo "No Android target is available for required Tasker HIL tests." | tee -a "$GITHUB_STEP_SUMMARY" >&2
            exit 1
          fi
          echo "serial=$serial" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "Core Tasker HIL target: $serial ($kind)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Core Tasker HIL preflight
        run: bash tools/hil/preflight.sh '${{ steps.tasker.outputs.serial }}'

      - name: Clear integration logcat window
        run: '$ANDROID_HOME/platform-tools/adb -s "${{ steps.tasker.outputs.serial }}" logcat -c'

      - name: Install branch build on core Tasker HIL target
        run: bash tools/hil/install.sh '${{ steps.tasker.outputs.serial }}'

      - name: Sync exact branch Tasker profiles on core target
        env:
          CYANBRIDGE_HIL_SERIAL: ${{ steps.tasker.outputs.serial }}
        run: bash tools/hil/sync_tasker_profiles.sh '${{ steps.tasker.outputs.serial }}'

      - name: Verify or recover core Tasker target after profile import
        id: tasker_ready
        shell: bash
        env:
          CYANBRIDGE_HIL_EMULATOR_AVD: ${{ vars.CYANBRIDGE_HIL_EMULATOR_AVD || '' }}
        run: |
          set -euo pipefail
          serial='${{ steps.tasker.outputs.serial }}'
          kind='${{ steps.tasker.outputs.kind }}'
          adb="$ANDROID_HOME/platform-tools/adb"

          sleep 3
          state="$($adb -s "$serial" get-state 2>/dev/null || true)"
          if [ "$state" != "device" ]; then
            if [ "$kind" != "emulator" ]; then
              echo "Physical Tasker HIL target disconnected after profile import; refusing to substitute another device." >&2
              exit 1
            fi
            echo "Persistent emulator disappeared after Tasker import; restarting the configured AVD." | tee -a "$GITHUB_STEP_SUMMARY"
            serial="$(bash tools/hil/start_emulator.sh)"
            test -n "$serial"
            bash tools/hil/preflight.sh "$serial"
            bash tools/hil/install.sh "$serial"
          fi

          test "$($adb -s "$serial" get-state)" = "device"
          echo "serial=$serial" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "Ready core Tasker target: $serial ($kind)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run core Tasker HIL suite
        env:
          CYANBRIDGE_HIL_SERIAL: ${{ steps.tasker_ready.outputs.serial }}
          CYANBRIDGE_HIL_GLASSES: ${{ steps.tasker_ready.outputs.kind == 'physical' && vars.CYANBRIDGE_HIL_ENABLE_GLASSES || 'false' }}
          CYANBRIDGE_HIL_EXPECT_VISUAL_FACT: ${{ steps.tasker_ready.outputs.kind == 'physical' && vars.CYANBRIDGE_HIL_EXPECT_VISUAL_FACT || 'false' }}
        run: >-
          bash tools/hil/run_instrumentation.sh
          '${{ steps.tasker_ready.outputs.serial }}'
          hardware
          com.fersaiyan.cyanbridge.hil.HilFixtureSmokeTest,com.fersaiyan.cyanbridge.hil.TaskerLocalAgentHilTest,com.fersaiyan.cyanbridge.hil.AutoDiaryTaskerHilTest,com.fersaiyan.cyanbridge.hil.AiTaskerProfileHilTest,com.fersaiyan.cyanbridge.hil.VisualDiaryHeyCyanHilTest

      - name: Prepare persistent emulator for AI automation HIL
        id: automation_emulator
        if: vars.CYANBRIDGE_HIL_ENABLE_LOCAL_AI == 'true' || vars.CYANBRIDGE_HIL_ENABLE_EMAIL_SEND == 'true'
        shell: bash
        env:
          CYANBRIDGE_HIL_EMULATOR_AVD: ${{ vars.CYANBRIDGE_HIL_EMULATOR_AVD || '' }}
        run: |
          set -euo pipefail
          adb="$ANDROID_HOME/platform-tools/adb"
          serial='${{ steps.emulator.outputs.serial }}'
          if [ -z "$serial" ] || [ "$($adb -s "$serial" get-state 2>/dev/null || true)" != "device" ]; then
            serial="$(bash tools/hil/start_emulator.sh)"
          fi
          test -n "$serial"
          test "$($adb -s "$serial" get-state)" = "device"

          bash tools/hil/preflight.sh "$serial"
          bash tools/hil/install.sh "$serial"

          # If the core suite ran on the physical glasses phone, import this branch's Tasker
          # profiles into the licensed automation emulator too. If it already was the core target,
          # avoid a duplicate five-project import cycle.
          if [ "$serial" != '${{ steps.tasker_ready.outputs.serial }}' ]; then
            CYANBRIDGE_HIL_SERIAL="$serial" bash tools/hil/sync_tasker_profiles.sh "$serial"
            sleep 3
            if [ "$($adb -s "$serial" get-state 2>/dev/null || true)" != "device" ]; then
              echo "Automation emulator disappeared after Tasker import; cold-booting persistent AVD." | tee -a "$GITHUB_STEP_SUMMARY"
              serial="$(bash tools/hil/start_emulator.sh)"
              test -n "$serial"
              bash tools/hil/preflight.sh "$serial"
              bash tools/hil/install.sh "$serial"
            fi
          fi

          test "$($adb -s "$serial" get-state)" = "device"
          echo "serial=$serial" >> "$GITHUB_OUTPUT"
          echo "Automation AI/Gmail target: $serial (persistent emulator)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Prepare deterministic Chrome fixture for AI automation HIL
        if: steps.automation_emulator.outputs.serial != ''
        shell: bash
        env:
          ENABLE_EMAIL_SEND: ${{ vars.CYANBRIDGE_HIL_ENABLE_EMAIL_SEND || 'false' }}
        run: |
          set -euo pipefail
          serial='${{ steps.automation_emulator.outputs.serial }}'
          mkdir -p build/hil/results
          python3 tools/hil/serve_web_fixture.py --port 8765 > build/hil/results/web-fixture.log 2>&1 &
          echo $! > build/hil/web-fixture.pid
          python3 - <<'PY'
          import time
          import urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8765/", timeout=1) as response:
                      if response.status == 200:
                          break
              except Exception:
                  if attempt == 29:
                      raise
                  time.sleep(0.2)
          PY
          "$ANDROID_HOME/platform-tools/adb" -s "$serial" reverse tcp:8765 tcp:8765
          "$ANDROID_HOME/platform-tools/adb" -s "$serial" shell pm path com.android.chrome | grep -q '^package:'
          if [ "$ENABLE_EMAIL_SEND" = "true" ]; then
            "$ANDROID_HOME/platform-tools/adb" -s "$serial" shell pm path com.google.android.gm | grep -q '^package:'
          fi
          "$ANDROID_HOME/platform-tools/adb" -s "$serial" shell pm grant com.fersaiyan.cyanbridge android.permission.POST_NOTIFICATIONS || true
          "$ANDROID_HOME/platform-tools/adb" -s "$serial" shell am force-stop com.android.chrome
          "$ANDROID_HOME/platform-tools/adb" -s "$serial" shell am start -W \
            -a android.intent.action.VIEW \
            -d 'http://127.0.0.1:8765/' \
            -p com.android.chrome
          sleep 2
          "$ANDROID_HOME/platform-tools/adb" -s "$serial" shell input keyevent KEYCODE_HOME

      - name: Run CyanBridge local AI through Tasker and Chrome
        if: vars.CYANBRIDGE_HIL_ENABLE_LOCAL_AI == 'true'
        env:
          CYANBRIDGE_HIL_SERIAL: ${{ steps.automation_emulator.outputs.serial }}
          CYANBRIDGE_HIL_LOCAL_AI: 'true'
        run: >-
          bash tools/hil/run_instrumentation.sh
          '${{ steps.automation_emulator.outputs.serial }}'
          hardware
          com.fersaiyan.cyanbridge.hil.LocalAiTaskerChromeHilTest

      - name: Reset Chrome fixture for approved email HIL
        if: vars.CYANBRIDGE_HIL_ENABLE_EMAIL_SEND == 'true'
        shell: bash
        run: |
          set -euo pipefail
          serial='${{ steps.automation_emulator.outputs.serial }}'
          "$ANDROID_HOME/platform-tools/adb" -s "$serial" shell am force-stop com.android.chrome
          "$ANDROID_HOME/platform-tools/adb" -s "$serial" shell am start -W \
            -a android.intent.action.VIEW \
            -d 'http://127.0.0.1:8765/' \
            -p com.android.chrome
          sleep 2
          "$ANDROID_HOME/platform-tools/adb" -s "$serial" shell input keyevent KEYCODE_HOME

      - name: Run approved smartglasses-summary Gmail self-send HIL
        if: vars.CYANBRIDGE_HIL_ENABLE_EMAIL_SEND == 'true'
        env:
          CYANBRIDGE_HIL_SERIAL: ${{ steps.automation_emulator.outputs.serial }}
          CYANBRIDGE_HIL_EMAIL_SEND: 'true'
        run: >-
          bash tools/hil/run_instrumentation.sh
          '${{ steps.automation_emulator.outputs.serial }}'
          hardware
          com.fersaiyan.cyanbridge.hil.LocalAgentEmailApprovalHilTest

      - name: Stop deterministic Chrome fixture
        if: always() && steps.automation_emulator.outputs.serial != ''
        shell: bash
        run: |
          serial='${{ steps.automation_emulator.outputs.serial }}'
          "$ANDROID_HOME/platform-tools/adb" -s "$serial" reverse --remove tcp:8765 >/dev/null 2>&1 || true
          if [ -f build/hil/web-fixture.pid ]; then
            kill "$(cat build/hil/web-fixture.pid)" >/dev/null 2>&1 || true
          fi

      - name: Collect Tasker HIL diagnostics
        if: failure()
        env:
          CYANBRIDGE_HIL_SERIAL: ${{ steps.automation_emulator.outputs.serial || steps.tasker_ready.outputs.serial || steps.tasker.outputs.serial }}
          CYANBRIDGE_HIL_UPLOAD_VISUAL_DIAGNOSTICS: ${{ vars.CYANBRIDGE_HIL_UPLOAD_VISUAL_DIAGNOSTICS || 'false' }}
        run: |
          serial='${{ steps.automation_emulator.outputs.serial || steps.tasker_ready.outputs.serial || steps.tasker.outputs.serial }}'
          if [ -n "$serial" ]; then
            bash tools/hil/collect_diagnostics.sh "$serial"
          fi

      - name: Upload HIL test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyanbridge-hil-results-${{ github.sha }}
          path: |
            build/hil/results/**
            build/hil/diagnostics-safe/**
            build/hil/emulator.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload opt-in private visual diagnostics
        if: failure() && vars.CYANBRIDGE_HIL_UPLOAD_VISUAL_DIAGNOSTICS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cyanbridge-hil-private-visuals-${{ github.sha }}
          path: build/hil/diagnostics-private/**
          if-no-files-found: ignore
          retention-days: 1
